[package]
name = "vanity-miner"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[lib]
doctest = false # no doctests; the LTO profile breaks rustdoc's extern lookup

[dependencies]
tape-sha256 = { git = "https://github.com/chimera-defi/sha256", rev = "fd76bb03e8dfa910dc2a6b97a7e8871e369a6b01" } # Apache-2.0; fork carrying hash_short_heads until spool-labs/sha256#4 merges
sha2 = "0.10"         # MIT/Apache-2.0: independent SHA-256 for verification
blake3 = "1"         # CC0/Apache-2.0: optional second algorithm
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
