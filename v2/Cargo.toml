[package]
name = "vanity-miner"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
tape-sha256 = "0.2"   # Apache-2.0: batch SHA-256, runtime AVX2/AVX-512
sha2 = "0.10"         # MIT/Apache-2.0: independent SHA-256 for verification
blake3 = "1"         # CC0/Apache-2.0: optional second algorithm
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
